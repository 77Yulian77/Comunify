<script type="module">
  import { getAllIncidencias, updateIncidenciaEstado, getIncidenciaStats, ZONA_LABELS, ESTADO_COLORS } from './js/api.js'
  import { getAdminSession, adminLogout } from './js/auth.js'
  import { buildReportUrl } from './js/qr-reader.js'
  import QRCode from 'qrcode'

  if (!getAdminSession()) {
    window.location.href = 'login.html'
  }

  lucide.createIcons()

  const session = getAdminSession()
  if (session?.user?.email) {
    const adminEmailEl = document.getElementById('admin-email')
    if (adminEmailEl) adminEmailEl.textContent = session.user.email
  }

  // Logout
  const logoutBtn = document.getElementById('logout-btn')
  if (logoutBtn) logoutBtn.addEventListener('click', adminLogout)

  let allIncidencias = []
  let currentTicketForState = null

  const ZONA_ICONS = {
    pasillo: 'door-open', parqueadero: 'car', ascensor: 'move-vertical',
    zonas_verdes: 'trees', lobby: 'building',
  }

  async function loadData() {
    try {
      const [incidencias, stats] = await Promise.all([
        getAllIncidencias(getFilters()),
        getIncidenciaStats(),
      ])
      allIncidencias = incidencias
      renderTable(incidencias)
      renderStats(stats)
    } catch (err) {
      console.error("Error cargando datos:", err)
      renderError(err.message || "Error al conectar con la base de datos")
    }
  }

  function getFilters() {
    return {
      torre: document.getElementById('filter-torre')?.value || 'all',
      piso: document.getElementById('filter-piso')?.value || 'all',
      estado: document.getElementById('filter-estado')?.value || 'all',
    }
  }

  function renderStats(stats) {
    if (!stats) return;
    const elTotal = document.getElementById('stat-total')
    const elPendientes = document.getElementById('stat-pendientes')
    const elProceso = document.getElementById('stat-proceso')
    const elResueltos = document.getElementById('stat-resueltos')

    if (elTotal) elTotal.textContent = stats.total || 0
    if (elPendientes) elPendientes.textContent = stats.pendientes || 0
    if (elProceso) elProceso.textContent = stats.enProceso || 0
    if (elResueltos) elResueltos.textContent = stats.resueltos || 0
  }

  function renderTable(incidencias) {
    const tbody = document.getElementById('incidencias-tbody')
    if (!tbody) return;

    if (incidencias.length === 0) {
      tbody.innerHTML = `
          <tr><td colspan="7" class="px-4 py-12 text-center text-gray-400">
            <div class="flex flex-col items-center gap-2">
              <i data-lucide="inbox" class="w-8 h-8 text-gray-300"></i>
              <p class="text-sm">No hay incidencias que coincidan con los filtros</p>
            </div>
          </td></tr>`
      lucide.createIcons()
      return
    }

    tbody.innerHTML = incidencias.map(inc => {
      const estado = ESTADO_COLORS?.[inc.estado] || { bg: '#f3f4f6', text: '#374151', dot: '#9ca3af' }
      const date = new Date(inc.created_at)
      const formattedDate = date.toLocaleString('es-CO', {
        day: '2-digit', month: '2-digit', year: 'numeric',
        hour: '2-digit', minute: '2-digit'
      })
      const zonaLabel = ZONA_LABELS?.[inc.zona] || inc.zona
      const zonaIcon = ZONA_ICONS[inc.zona] || 'map-pin'

      return `
          <tr class="border-b border-gray-100 hover:bg-gray-50 transition-colors">
            <td class="px-4 py-3 font-mono text-xs font-semibold text-comunify-blue">${inc.ticket_number}</td>
            <td class="px-4 py-3"><span class="font-semibold">${inc.torre}</span></td>
            <td class="px-4 py-3">${inc.piso}</td>
            <td class="px-4 py-3">
              <span class="inline-flex items-center gap-1.5 text-xs">
                <i data-lucide="${zonaIcon}" class="w-3.5 h-3.5 text-gray-400"></i>
                ${zonaLabel}
              </span>
            </td>
            <td class="px-4 py-3">
              <span class="estado-badge" style="background:${estado.bg};color:${estado.text}">
                <span class="estado-dot" style="background:${estado.dot}"></span>
                ${inc.estado}
              </span>
            </td>
            <td class="px-4 py-3 text-gray-500 text-xs whitespace-nowrap">${formattedDate}</td>
            <td class="px-4 py-3 text-right">
              <div class="flex items-center justify-end gap-1">
                <button onclick="viewDetail('${inc.ticket_number}')" class="p-2 text-gray-400 hover:text-comunify-blue hover:bg-blue-50 rounded-lg transition-all" title="Ver detalle">
                  <i data-lucide="eye" class="w-4 h-4"></i>
                </button>
                <button onclick="openStateModal('${inc.ticket_number}')" class="p-2 text-gray-400 hover:text-amber-600 hover:bg-amber-50 rounded-lg transition-all" title="Cambiar estado">
                  <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                </button>
              </div>
            </td>
          </tr>`
    }).join('')

    lucide.createIcons()
  }

  function renderError(msg) {
    const tbody = document.getElementById('incidencias-tbody')
    if (!tbody) return;
    tbody.innerHTML = `
        <tr><td colspan="7" class="px-4 py-12 text-center text-red-500">
          <div class="flex flex-col items-center gap-2">
            <i data-lucide="alert-triangle" class="w-8 h-8"></i>
            <p class="text-sm">${msg}</p>
          </div>
        </td></tr>`
    lucide.createIcons()
  }

  // Filtros (con protección null)
  const filterTorre = document.getElementById('filter-torre')
  const filterPiso = document.getElementById('filter-piso')
  const filterEstado = document.getElementById('filter-estado')
  const clearFiltersBtn = document.getElementById('clear-filters')

  if (filterTorre) filterTorre.addEventListener('change', loadData)
  if (filterPiso) filterPiso.addEventListener('change', loadData)
  if (filterEstado) filterEstado.addEventListener('change', loadData)

  if (clearFiltersBtn) {
    clearFiltersBtn.addEventListener('click', () => {
      if (filterTorre) filterTorre.value = 'all'
      if (filterPiso) filterPiso.value = 'all'
      if (filterEstado) filterEstado.value = 'all'
      loadData()
    })
  }

  // Ver detalle
  window.viewDetail = (ticket) => {
    window.open(`consultar.html?ticket=${ticket}`, '_blank')
  }

  // Modal de estado
  window.openStateModal = (ticket) => {
    currentTicketForState = ticket
    const modalTicket = document.getElementById('modal-ticket')
    if (modalTicket) modalTicket.textContent = ticket

    const modal = document.getElementById('state-modal')
    if (modal) {
      modal.classList.remove('hidden')
      modal.classList.add('flex')
    }
  }

  const closeModalBtn = document.getElementById('close-modal')
  if (closeModalBtn) {
    closeModalBtn.addEventListener('click', () => {
      const modal = document.getElementById('state-modal')
      if (modal) {
        modal.classList.add('hidden')
        modal.classList.remove('flex')
      }
    })
  }

  document.querySelectorAll('.estado-option').forEach(btn => {
    btn.addEventListener('click', async () => {
      const nuevoEstado = btn.dataset.estado
      if (!currentTicketForState) return

      try {
        await updateIncidenciaEstado(currentTicketForState, nuevoEstado)
        const modal = document.getElementById('state-modal')
        if (modal) {
          modal.classList.add('hidden')
          modal.classList.remove('flex')
        }
        loadData()
      } catch (err) {
        alert('Error al cambiar estado: ' + err.message)
      }
    })
  })

  // Modal QR
  const qrModal = document.getElementById('qr-modal')
  function openQrModal() {
    if (qrModal) {
      qrModal.classList.remove('hidden')
      qrModal.classList.add('flex')
      generateQR()
    }
  }

  const qrLink = document.querySelector('a[href="qr-generator.html"]')
  if (qrLink) {
    qrLink.addEventListener('click', (e) => {
      e.preventDefault()
      openQrModal()
    })
  }

  const closeQrModalBtn = document.getElementById('close-qr-modal')
  if (closeQrModalBtn) {
    closeQrModalBtn.addEventListener('click', () => {
      if (qrModal) {
        qrModal.classList.add('hidden')
        qrModal.classList.remove('flex')
      }
    })
  }

  async function generateQR() {
    const torre = document.getElementById('qr-torre')?.value || 'A'
    const piso = document.getElementById('qr-piso')?.value || '1'
    const zona = document.getElementById('qr-zona')?.value || 'pasillo'
    const url = buildReportUrl(torre, piso, zona)
    const canvas = document.getElementById('qr-canvas')

    if (canvas) {
      try {
        await QRCode.toCanvas(canvas, url, {
          width: 256,
          margin: 2,
          color: { dark: '#0D9488', light: '#ffffff' },
        })
        const qrUrlEl = document.getElementById('qr-url')
        if (qrUrlEl) qrUrlEl.textContent = url

        canvas.toBlob((blob) => {
          const dl = document.getElementById('qr-download')
          if (dl && blob) dl.href = URL.createObjectURL(blob)
        }, 'image/png')
      } catch (err) {
        console.error("Error generando QR:", err)
      }
    }
  }

  const qrTorre = document.getElementById('qr-torre')
  const qrPiso = document.getElementById('qr-piso')
  const qrZona = document.getElementById('qr-zona')

  if (qrTorre) qrTorre.addEventListener('change', generateQR)
  if (qrPiso) qrPiso.addEventListener('change', generateQR)
  if (qrZona) qrZona.addEventListener('change', generateQR)

  // Cerrar modales al hacer clic fuera
  const stateModal = document.getElementById('state-modal')
  if (stateModal) {
    stateModal.addEventListener('click', (e) => {
      if (e.target === e.currentTarget) {
        e.currentTarget.classList.add('hidden')
        e.currentTarget.classList.remove('flex')
      }
    })
  }

  if (qrModal) {
    qrModal.addEventListener('click', (e) => {
      if (e.target === e.currentTarget) {
        e.currentTarget.classList.add('hidden')
        e.currentTarget.classList.remove('flex')
      }
    })
  }

  // ¡INICIAR CARGA DE DATOS!
  loadData()
</script>
