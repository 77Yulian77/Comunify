<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/assets/logo-icon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solicitudes de contacto - Comunify</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { comunify: { blue: "#0D9488", "blue-light": "#14B8A6", "blue-dark": "#0F766E" } } } }
    }
  </script>
  <link rel="stylesheet" href="/css/custom.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col">

  <nav class="bg-white border-b border-gray-200 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-16">
        <a href="index.html" class="flex items-center gap-3"><img src="/assets/logo-comunify.png" alt="Comunify" class="h-16"></a>
        <div class="flex items-center gap-6">
          <a href="planes.html" class="text-gray-600 hover:text-comunify-blue text-sm font-medium transition-colors">Planes</a>
          <a href="consultar.html" class="text-gray-600 hover:text-comunify-blue text-sm font-medium transition-colors">Consultar ticket</a>
          <a href="index.html" class="text-gray-600 hover:text-comunify-blue text-sm font-medium transition-colors">Inicio</a>
        </div>
      </div>
    </div>
  </nav>

  <main class="flex-1 py-10 px-4">
    <div class="max-w-5xl mx-auto">
      <div class="flex items-center justify-between mb-6">
        <div>
          <h1 class="text-2xl font-bold">Solicitudes de contacto</h1>
          <p class="text-sm text-gray-500">Personas que se registraron en la página principal y esperan que las contactemos.</p>
        </div>
        <a href="dashboard.html" class="text-sm text-comunify-blue font-medium">&larr; Volver al panel</a>
      </div>
      <div id="lista" class="space-y-3"><p class="text-gray-400 text-sm">Cargando...</p></div>
    </div>
  </main>
  <footer class="bg-gray-900 text-gray-500 py-6 px-4 text-center text-sm mt-auto">
    Comunify © 2026 - Pagos procesados por Wompi (Bancolombia). Valores en pesos colombianos (COP).
  </footer>

  <script type="module">
    import { supabase } from './js/api.js'
    import { getAdminSession } from './js/auth.js'
    lucide.createIcons()

    if (!getAdminSession()) location.href = 'login.html'

    const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))

    async function cargar() {
      const { data, error } = await supabase
        .from('solicitudes_contacto').select('*').order('created_at', { ascending: false }).limit(100)
      const lista = document.getElementById('lista')
      if (error) { lista.innerHTML = `<p class="text-red-600 text-sm">No se pudieron cargar las solicitudes: ${esc(error.message)}</p>`; return }
      if (!data.length) { lista.innerHTML = '<p class="text-gray-500 text-sm bg-white rounded-xl border border-gray-200 p-6 text-center">Todavía no hay solicitudes.</p>'; return }

      lista.innerHTML = data.map((s) => `
        <div class="bg-white rounded-xl border border-gray-200 p-5 flex flex-col sm:flex-row sm:items-start justify-between gap-4">
          <div class="text-sm">
            <p class="font-semibold text-gray-900">${esc(s.conjunto_nombre)}
              <span class="ml-2 text-xs px-2 py-0.5 rounded-full ${s.estado === 'nueva' ? 'bg-amber-100 text-amber-700' : 'bg-green-100 text-green-700'}">${s.estado === 'nueva' ? 'Nueva' : 'Contactada'}</span>
            </p>
            <p class="text-gray-600 mt-1">${esc(s.contacto_nombre)} · <a class="text-comunify-blue underline" href="mailto:${esc(s.email)}">${esc(s.email)}</a>${s.telefono ? ' · ' + esc(s.telefono) : ''}</p>
            ${s.mensaje ? `<p class="text-gray-500 mt-2">“${esc(s.mensaje)}”</p>` : ''}
            <p class="text-xs text-gray-400 mt-2">${new Date(s.created_at).toLocaleString('es-CO')}${s.notificada ? ' · avisada por correo' : ''}</p>
          </div>
          <button data-id="${s.id}" data-estado="${s.estado}" class="marcar border border-gray-300 hover:bg-gray-50 text-gray-700 px-4 py-2 rounded-lg text-sm font-semibold whitespace-nowrap">
            ${s.estado === 'nueva' ? 'Marcar como contactada' : 'Volver a nueva'}
          </button>
        </div>`).join('')

      document.querySelectorAll('.marcar').forEach((b) => b.addEventListener('click', async () => {
        const nuevo = b.dataset.estado === 'nueva' ? 'contactada' : 'nueva'
        const { error: e } = await supabase.from('solicitudes_contacto').update({ estado: nuevo }).eq('id', b.dataset.id)
        if (e) { alert('No se pudo actualizar: ' + e.message); return }
        cargar()
      }))
    }
    cargar()
  </script>
</body>
</html>
